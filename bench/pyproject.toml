[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-execution-bench"
version = "0.1.0"
description = "Reproducible offline benchmark for agent payment execution and liquidity decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Arena Execution Bench contributors"}]
dependencies = ["jsonschema>=4.18,<5"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
aeb = "aeb.cli:main"

[project.urls]
Repository = "https://github.com/sunruize93-cmyk/arena-execution-bench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeb = ["data/scenarios/*.json", "data/contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
